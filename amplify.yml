version: 1
backend:
  phases:
    build:
      commands:
        - 'yarn install --immutable'
        - 'export CONVEX_DEPLOY_KEY=$(aws ssm get-parameter --name "/amplify/shared/$AWS_APP_ID/convexToken" --with-decryption --query Parameter.Value --output text)'
        - 'npx convex deploy'
frontend:
  phases:
    preBuild:
      commands:
    build:
      commands:
        - 'yarn run build'
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - 'node_modules/**/*'
